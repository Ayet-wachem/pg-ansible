---
- name: Dependances depot
  apt:
    name: [curl, ca-certificates, gnupg]
    state: present
    update_cache: true

- name: Cle GPG PGDG
  apt_key:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Depot apt.postgresql.org
  apt_repository:
    repo: "deb http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present

- name: Installer PostgreSQL {{ pg_version }}
  apt:
    name: "postgresql-{{ pg_version }}"
    state: present
    update_cache: true
