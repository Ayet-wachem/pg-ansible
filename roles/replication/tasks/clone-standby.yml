---
- name: Arreter PostgreSQL sur le standby
  service:
    name: "{{ pg_service }}"
    state: stopped

- name: Vider le repertoire de donnees du standby
  file:
    path: "{{ pg_data }}"
    state: absent

- name: Recreer le repertoire de donnees vide
  file:
    path: "{{ pg_data }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Cloner les donnees depuis le master (pg_basebackup)
  become_user: postgres
  command: >
    {{ pg_bindir }}/pg_basebackup
    -h {{ master_ip }} -p {{ pg_port }}
    -U repl -D {{ pg_data }}
    -Fp -Xs -P -R
  args:
    creates: "{{ pg_data }}/PG_VERSION"

- name: Forcer application_name dans primary_conninfo (CORRECTIF cle repmgr)
  become_user: postgres
  lineinfile:
    path: "{{ pg_data }}/postgresql.auto.conf"
    regexp: '^primary_conninfo'
    line: >-
      primary_conninfo = 'user=repl
      passfile=''{{ pg_home_dir }}/.pgpass''
      host={{ master_ip }} port={{ pg_port }}
      application_name={{ inventory_hostname }}'

- name: Demarrer PostgreSQL sur le standby
  service:
    name: "{{ pg_service }}"
    state: started
