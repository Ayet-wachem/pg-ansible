---
pg_bindir: >-
  {{ '/usr/pgsql-' ~ pg_version ~ '/bin'
     if ansible_os_family == 'RedHat'
     else '/usr/lib/postgresql/' ~ pg_version ~ '/bin' }}
pg_data: >-
  {{ '/var/lib/pgsql/' ~ pg_version ~ '/data'
     if ansible_os_family == 'RedHat'
     else '/var/lib/postgresql/' ~ pg_version ~ '/main' }}
pg_service: >-
  {{ 'postgresql-' ~ pg_version
     if ansible_os_family == 'RedHat'
     else 'postgresql@' ~ pg_version ~ '-main' }}
master_ip: "{{ '172.16.50.180' if 'alma' in inventory_hostname else '172.16.50.185' }}"
pg_home_dir: "{{ '/var/lib/pgsql' if ansible_os_family == 'RedHat' else '/var/lib/postgresql' }}"
